name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with GITHUB_TOKEN does not start another workflow, so the
  # fundraising job calls this one directly after committing a new total.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` also prints build/cv.pdf from the page it just built, so
      # the download can never fall behind the site. Runner images ship Chrome;
      # if that ever stops being true the build fails rather than shipping a
      # download that 404s.
      - name: Build
        run: npm run build
        env:
          # A user site (<name>.github.io) serves from the root, so BASE_PATH stays
          # empty. For a project repo, set it to: /${{ github.event.repository.name }}
          BASE_PATH: ''

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
